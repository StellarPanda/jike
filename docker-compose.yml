name: jike-db-query

services:
  postgres:
    image: postgres:15-alpine
    container_name: db-query-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_query_demo
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_query_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
