[project]
name = "db-query-backend"
version = "0.1.0"
description = "Backend for the database query generator MVP"
readme = "README.md"
authors = [
    { name = "jnchen", email = "jiananchen2022@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "psycopg[binary]>=3.2.9",
    "uvicorn[standard]>=0.35.0",
    "sqlglot>=30.15.0",
]

[project.scripts]
backend = "db_query_backend.main:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
